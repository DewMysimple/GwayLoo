      <style scoped>
        #loader {
          position: fixed;
          width: 100vw;
          height: 100vh;
          z-index: 99999;
          background: black;
          top: 0;
        }

        .loader-w {
          position: absolute;
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
          margin: auto;
          height: max-content;
          width: max-content;
        }

        .loader-bar {
          width: 100%;
          height: 1px;
          background: rgba(255, 255, 255, 0.1);
          position: absolute;
          right: 0;
          left: 0;
          margin: 0 auto;
          bottom: -15px;
        }

        .loader-bar-animated {
          background: #fff;
          transform: scaleX(0);
          transform-origin: left;
          transition: transform 0.1s ease-out;
        }

        .loader-img { width: 166px; }

        @media (min-width: 768px) {
          .loader-img { width: 200px; }
        }
